<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Z-Score Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Z-Score Calculator</h1>

  <div class="card">
    <label>Mean (μ):</label>
    <input id="mean" type="number">

    <label>Standard Deviation (σ):</label>
    <input id="std" type="number">

    <label>Value (x):</label>
    <input id="value" type="number">

    <button onclick="calculateZ()">Calculate</button>

    <p id="result"></p>
  </div>

  <a href="index.html">⬅ Back to Home</a>

  <script src="script.js"></script>
</body>
</html>
