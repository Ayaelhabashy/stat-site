<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ANOVA Calculator</title>
  <link rel="stylesheet" href="style.css">

  <!-- Stats library for p-value -->
  <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
</head>

<body>

<h1>One-Way ANOVA Calculator</h1>

<div class="card">

  <p>Enter comma-separated values for each group:</p>

  <label>Group 1:</label>
  <input id="g1" placeholder="e.g. 5,6,7">

  <label>Group 2:</label>
  <input id="g2" placeholder="e.g. 8,9,10">

  <label>Group 3:</label>
  <input id="g3" placeholder="e.g. 4,5,6">

  <button onclick="runANOVA()">Calculate ANOVA</button>

  <p id="result"></p>

</div>

<a href="index.html">⬅ Back Home</a>

<script src="script.js"></script>

</body>
</html>
